<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161B">
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUGxhY2FyIGRlIFbDs2xlaSIsInNob3J0X25hbWUiOiJQbGFjYXIiLCJzdGFydF91cmwiOiIuIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJvcmllbnRhdGlvbiI6ImxhbmRzY2FwZSIsImJhY2tncm91bmRfY29sb3IiOiIjMTIxNjFCIiwidGhlbWVfY29sb3IiOiIjMTIxNjFCIn0=">
<title>CarPlarVL - Placar de Vôlei</title>
<style>
  :root{
    --bg:#12161B;
    --court:#1B2129;
    --line:#2A323C;
    --ink:#F3F1EA;
    --ink-dim:#8B94A0;
    --team-a:#2F6FED;
    --team-a-dim:#1E4CA8;
    --team-b:#E5484D;
    --team-b-dim:#A32A2E;
    --app-w:100vw;
    --app-h:100vh;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);}

  #stage{
    position:fixed;
    top:0; left:0;
    width:var(--app-w);
    height:var(--app-h);
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  @media screen and (orientation:portrait){
    #stage{
      width:var(--app-h);
      height:var(--app-w);
      transform-origin:top left;
      transform:rotate(90deg) translateY(-100%);
    }
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:10px clamp(10px,2vw,22px);
    gap:12px;
    flex:0 0 auto;
  }
  .name-block{display:flex;flex-direction:column;gap:2px;max-width:40%;}
  .name-block.b{align-items:flex-end;}
  .team-name{
    font-size:clamp(14px,2.4vw,22px);
    font-weight:700;
    letter-spacing:.02em;
    padding:6px 10px;
    border-radius:8px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    cursor:text;
  }
  .team-name.a{color:var(--team-a);}
  .team-name.b{color:var(--team-b);text-align:right;}
  .team-name[contenteditable="true"]{
    background:var(--court);
    outline:1px solid var(--line);
    white-space:normal;
    text-overflow:clip;
  }
  .dots-btn{
    background:none;border:none;color:var(--ink-dim);
    font-size:14px;letter-spacing:2px;padding:2px 8px;cursor:pointer;opacity:.5;
  }
  .dots-btn:active{opacity:1;}
  .swatches{
    display:none;gap:6px;padding:4px 6px;
    background:var(--court);border:1px solid var(--line);border-radius:20px;
  }
  .swatches.open{display:flex;}
  .swatch{
    width:16px;height:16px;border-radius:50%;cursor:pointer;border:1px solid rgba(255,255,255,.25);
  }

  .mid-col{
    display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;
  }
  .timer{
    font-family:'Oswald','Inter',sans-serif;
    font-size:clamp(18px,3.2vw,30px);
    font-variant-numeric:tabular-nums;
    letter-spacing:.04em;
    padding:4px 14px;border-radius:8px;
    border:1px solid var(--line);background:var(--court);color:var(--ink);cursor:pointer;
  }
  .timer.running{border-color:#4CAF6B;color:#8FE0A8;}
  .reset-btn{
    background:none;border:none;color:var(--ink-dim);font-size:11px;
    letter-spacing:.03em;margin-top:2px;cursor:pointer;padding:2px 6px;
  }

  main{flex:1 1 auto;display:flex;min-height:0;}
  .panel{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;cursor:pointer;
    background:linear-gradient(180deg,var(--panel-c,#888) 0%,var(--panel-c-dim,#555) 100%);
  }
  .panel.a{--panel-c:var(--team-a);--panel-c-dim:var(--team-a-dim);}
  .panel.b{--panel-c:var(--team-b);--panel-c-dim:var(--team-b-dim);}
  .score{
    font-family:'Oswald','Inter',sans-serif;font-weight:600;
    font-size:min(38vh,26vw);line-height:1;color:#0E1116;
    transition:transform .12s ease;
  }
  .score.pulse{transform:scale(1.12);}
  .hint{position:absolute;bottom:10px;font-size:11px;color:rgba(14,17,22,.55);letter-spacing:.03em;}
  .divider{width:2px;background:var(--line);flex:0 0 auto;}

  .stepper{
    position:absolute;
    top:14px;right:14px;
    display:flex;flex-direction:column;
    background:rgba(14,17,22,.2);
    border:1px solid rgba(14,17,22,.3);
    border-radius:14px;
    overflow:hidden;
  }
  .stepper button{
    width:32px;height:28px;border:none;background:transparent;
    color:#0E1116;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .stepper button:active{background:rgba(14,17,22,.15);}
  .stepper button.up{border-bottom:1px solid rgba(14,17,22,.28);}

  .modal-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center;z-index:10;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--court);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:320px;text-align:center;
  }
  .modal p{margin:0 0 18px;font-size:15px;color:var(--ink);}
  .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal-actions button{
    flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--ink);font-size:14px;cursor:pointer;
  }
  .modal-actions .confirm{background:#C0392B;border-color:#C0392B;color:#fff;font-weight:600;}
</style>
</head>
<body>

<div id="stage">
  <header>
    <div class="name-block a">
      <div class="team-name a" id="nameA" contenteditable="false">Time 1</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="dots-btn" id="dotsA">⋮</button>
        <div class="swatches" id="swatchesA"></div>
      </div>
    </div>

    <div class="mid-col">
      <div class="timer" id="timer">00:00</div>
      <button class="reset-btn" id="resetBtn">zerar placar</button>
    </div>

    <div class="name-block b">
      <div class="team-name b" id="nameB" contenteditable="false">Time 2</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="swatches" id="swatchesB"></div>
        <button class="dots-btn" id="dotsB">⋮</button>
      </div>
    </div>
  </header>

  <main>
    <div class="panel a" id="panelA">
      <div class="stepper">
        <button class="up" data-key="a" data-delta="1">▲</button>
        <button class="down" data-key="a" data-delta="-1">▼</button>
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="hint">toque no campo para somar 1</div>
    </div>
    <div class="divider"></div>
    <div class="panel b" id="panelB">
      <div class="stepper">
        <button class="up" data-key="b" data-delta="1">▲</button>
        <button class="down" data-key="b" data-delta="-1">▼</button>
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="hint">toque no campo para somar 1</div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <p>Zerar o placar e o cronômetro?</p>
      <div class="modal-actions">
        <button id="cancelReset">Cancelar</button>
        <button class="confirm" id="confirmReset">Zerar</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  function syncSize(){
    document.documentElement.style.setProperty('--app-w', window.innerWidth+'px');
    document.documentElement.style.setProperty('--app-h', window.innerHeight+'px');
  }
  syncSize();
  window.addEventListener('resize', syncSize);
  window.addEventListener('orientationchange', ()=> setTimeout(syncSize,50));
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', syncSize); }

  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
    }catch(e){ /* not supported / denied */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') requestWakeLock();
  });
  document.addEventListener('pointerdown', ()=>{ if(!wakeLock) requestWakeLock(); }, {passive:true});

  const state = { a:0, b:0, seconds:0, running:false };
  let timerInterval = null;

  const scoreEl = { a: document.getElementById('scoreA'), b: document.getElementById('scoreB') };
  const panelEl = { a: document.getElementById('panelA'), b: document.getElementById('panelB') };
  const nameEl  = { a: document.getElementById('nameA'), b: document.getElementById('nameB') };
  const timerEl = document.getElementById('timer');

  // --- auto-save (rede de segurança contra a aba ser descartada pelo sistema) ---
  const STORAGE_KEY = 'placar-volei-state-v1';
  function saveState(){
    try{
      const css = getComputedStyle(document.documentElement);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        a: state.a, b: state.b, seconds: state.seconds, running: state.running,
        nameA: nameEl.a.textContent, nameB: nameEl.b.textContent,
        colorA: css.getPropertyValue('--team-a').trim(),
        colorADim: css.getPropertyValue('--team-a-dim').trim(),
        colorB: css.getPropertyValue('--team-b').trim(),
        colorBDim: css.getPropertyValue('--team-b-dim').trim()
      }));
    }catch(e){ /* localStorage indisponível (ex: modo privado) — ignora */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const s = JSON.parse(raw);
      state.a = s.a||0; state.b = s.b||0; state.seconds = s.seconds||0;
      scoreEl.a.textContent = state.a; scoreEl.b.textContent = state.b;
      timerEl.textContent = fmt(state.seconds);
      if(s.nameA) nameEl.a.textContent = s.nameA;
      if(s.nameB) nameEl.b.textContent = s.nameB;
      if(s.colorA) document.documentElement.style.setProperty('--team-a', s.colorA);
      if(s.colorADim) document.documentElement.style.setProperty('--team-a-dim', s.colorADim);
      if(s.colorB) document.documentElement.style.setProperty('--team-b', s.colorB);
      if(s.colorBDim) document.documentElement.style.setProperty('--team-b-dim', s.colorBDim);
      if(s.running) startTimer();
    }catch(e){ /* estado salvo corrompido — ignora e segue com o padrão */ }
  }
  function clearState(){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const r = (s%60).toString().padStart(2,'0');
    return m+':'+r;
  }
  function startTimer(){
    if(state.running) return;
    state.running = true;
    timerEl.classList.add('running');
    timerInterval = setInterval(()=>{
      state.seconds++;
      timerEl.textContent = fmt(state.seconds);
      saveState();
    },1000);
    saveState();
  }
  function pauseTimer(){
    state.running = false;
    timerEl.classList.remove('running');
    clearInterval(timerInterval);
    saveState();
  }
  timerEl.addEventListener('click', ()=> state.running ? pauseTimer() : startTimer());

  function pulse(key){
    scoreEl[key].classList.add('pulse');
    setTimeout(()=>scoreEl[key].classList.remove('pulse'),120);
  }
  function addPoint(key, delta){
    state[key] = Math.max(0, state[key]+delta);
    scoreEl[key].textContent = state[key];
    pulse(key);
    if(!state.running) startTimer();
    saveState();
  }

  panelEl.a.addEventListener('click', ()=> addPoint('a', 1));
  panelEl.b.addEventListener('click', ()=> addPoint('b', 1));

  document.querySelectorAll('.stepper button').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      addPoint(btn.dataset.key, parseInt(btn.dataset.delta,10));
    });
  });

  [ ['a', nameEl.a], ['b', nameEl.b] ].forEach(([key, el])=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      el.setAttribute('contenteditable','true');
      el.focus();
      document.execCommand('selectAll', false, null);
    });
    el.addEventListener('blur', ()=>{
      el.setAttribute('contenteditable','false');
      if(!el.textContent.trim()) el.textContent = key==='a' ? 'Time 1' : 'Time 2';
      saveState();
    });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
  });

  const PALETTE = ['#2F6FED','#E5484D','#2FB67C','#B23FED','#F2A93B','#3FA9F5'];
  function shade(hex, factor){
    const n = parseInt(hex.slice(1),16);
    const r = Math.round(((n>>16)&255)*factor);
    const g = Math.round(((n>>8)&255)*factor);
    const b = Math.round((n&255)*factor);
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function setupPicker(team, dotsBtnId, swatchesId){
    const btn = document.getElementById(dotsBtnId);
    const box = document.getElementById(swatchesId);
    PALETTE.forEach(c=>{
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = c;
      sw.addEventListener('click', e=>{
        e.stopPropagation();
        document.documentElement.style.setProperty('--team-'+team, c);
        document.documentElement.style.setProperty('--team-'+team+'-dim', shade(c,0.62));
        box.classList.remove('open');
        saveState();
      });
      box.appendChild(sw);
    });
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      box.classList.toggle('open');
    });
  }
  setupPicker('a','dotsA','swatchesA');
  setupPicker('b','dotsB','swatchesB');
  document.addEventListener('click', ()=>{
    document.getElementById('swatchesA').classList.remove('open');
    document.getElementById('swatchesB').classList.remove('open');
  });

  const overlay = document.getElementById('modalOverlay');
  document.getElementById('resetBtn').addEventListener('click', ()=> overlay.classList.add('open'));
  document.getElementById('cancelReset').addEventListener('click', ()=> overlay.classList.remove('open'));
  document.getElementById('confirmReset').addEventListener('click', ()=>{
    state.a = 0; state.b = 0; state.seconds = 0;
    scoreEl.a.textContent = 0; scoreEl.b.textContent = 0;
    pauseTimer();
    timerEl.textContent = '00:00';
    overlay.classList.remove('open');
    clearState();
  });

  loadState();
})();
</script>
</body>
</html>
